# Local stack: MySQL + chatgpt2api (free upstream, built from vendored source)
# + GPT Image Studio.
#
# Usage:
#   1. cp .env.example .env  (and edit secrets)
#   2. docker compose up -d --build
#   3. open http://localhost:3000
#
# Single external port: only `:3000` (the gpt-image-studio web app) is
# exposed. chatgpt2api is now fully native-integrated into image2creat_done's
# admin UI (号池 / 调用日志 / 注册机 / 系统设置 / 备份 tabs) and the iframe is
# gone. image2creat_done still calls chatgpt2api admin APIs over the docker
# network via UPSTREAM_PROXY_BASE_URL. The chatgpt2api container is bound to
# 127.0.0.1:8080 only for direct local debugging and is NOT reachable from
# the public internet.
#
# In the gpt-image-studio admin (login as ADMIN_EMAIL), open the
# 「号池」/「调用日志」/「注册机」/「系统设置」/「备份」 tabs to manage
# chatgpt2api directly from the parent app — no iframe, no separate login.
#
# chatgpt2api is vendored under vendor/chatgpt2api/ via `git subtree`.
# To pull the latest upstream changes:
#   git subtree pull --prefix=vendor/chatgpt2api \
#     https://github.com/basketikun/chatgpt2api.git main --squash
services:
  mysql:
    image: mysql:8.0
    container_name: gpt-image-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gpt_image_studio}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  chatgpt2api:
    build:
      context: ./vendor/chatgpt2api
      dockerfile: Dockerfile
      args:
        # Keep the chatgpt2api FastAPI admin / image / SPA routes under
        # /upstream/* so internal app -> chatgpt2api admin calls (see
        # src/upstream-api-client.js, ADMIN_BASE_PATH=/upstream) keep working.
        # The chatgpt2api Next.js admin SPA is no longer iframed; the parent
        # app exposes everything natively at /admin.
        NEXT_PUBLIC_BASE_PATH: /upstream
    image: gpt-image-chatgpt2api:local
    container_name: gpt-image-chatgpt2api
    restart: unless-stopped
    environment:
      STORAGE_BACKEND: json
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-chatgpt2api}
      # Mirror the build-time prefix at runtime so the FastAPI side mounts
      # admin / image / SPA routes under the same prefix.
      BASE_PATH: /upstream
    ports:
      # Bind to localhost only — the public-facing entry point is :3000.
      # image2creat_done calls chatgpt2api admin APIs over the docker network.
      # 127.0.0.1:8080 stays for direct local debugging.
      # (As of PR #12 there is no /upstream/* reverse proxy on :3000 anymore.)
      - "127.0.0.1:8080:80"
    volumes:
      - chatgpt2api-data:/app/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gpt-image-studio:local
    container_name: gpt-image-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      chatgpt2api:
        condition: service_started
    environment:
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gpt_image_studio}
      MYSQL_CREATE_DATABASE: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-password}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      AI_API_BASE_URL: http://chatgpt2api:80/v1
      AI_API_KEY: ${CHATGPT2API_AUTH_KEY:-chatgpt2api}
      # Bearer for the native admin endpoints at /api/admin/upstream/*
      # (account pool / call logs / register / system settings / backups).
      # image2creat_done uses it server-side to call chatgpt2api admin APIs
      # over the docker network.
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-chatgpt2api}
      # Optional second upstream — a CLIProxyAPI / OpenAI-compatible bearer
      # endpoint. Leave blank to keep chatgpt2api as the only upstream.
      CPA_API_BASE_URL: ${CPA_API_BASE_URL:-}
      CPA_API_KEY: ${CPA_API_KEY:-}
      CPA_IMAGE_MODEL: ${CPA_IMAGE_MODEL:-}
      ACTIVE_UPSTREAM: ${ACTIVE_UPSTREAM:-chatgpt2api}
      # Base URL the image2creat_done server uses internally to call
      # chatgpt2api admin APIs (account pool / logs / register / settings /
      # backups). Not exposed to browsers — admin pages talk to the parent
      # app's /api/admin/upstream/* which forwards here with the bearer key.
      UPSTREAM_PROXY_BASE_URL: http://chatgpt2api:80
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-2}
      DEFAULT_CREDITS: ${DEFAULT_CREDITS:-10}
      GENERATION_CREDIT_COST: ${GENERATION_CREDIT_COST:-1}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      REQUIRE_APPROVAL: ${REQUIRE_APPROVAL:-false}
      MAX_IMAGES_PER_REQUEST: ${MAX_IMAGES_PER_REQUEST:-1}
    ports:
      - "3000:3000"
    volumes:
      - app-generated:/app/data/generated

volumes:
  mysql-data:
  chatgpt2api-data:
  app-generated:
