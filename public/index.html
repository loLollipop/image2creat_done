<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GPT Image Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0f172a">
  </head>
  <body>
    <div id="app" class="app-layout">
      <!-- ===== Sidebar ===== -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <button id="brandBtn" class="brand-btn" type="button">
            <span class="brand-dot"><i class="ri-sparkling-2-fill"></i></span>
            <span>Image Studio</span>
          </button>
          <button id="newChatBtn" class="icon-btn" type="button" title="新对话">
            <i class="ri-add-line"></i>
          </button>
        </div>
        <div id="conversationList" class="conversation-list"></div>
        <div class="sidebar-footer">
          <button id="creditsBtn" class="sidebar-item hidden" type="button">
            <i class="ri-coin-line"></i>
            <span id="creditsText">0</span>
          </button>
          <button id="loginBtn" class="sidebar-item" type="button">
            <i class="ri-login-circle-line"></i>
            <span data-i18n="login">登录</span>
          </button>
          <button id="logoutBtn" class="sidebar-item hidden" type="button">
            <i class="ri-logout-circle-r-line"></i>
            <span data-i18n="logout">退出</span>
          </button>
        </div>
      </aside>

      <!-- ===== Mobile sidebar toggle ===== -->
      <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="Toggle sidebar">
        <i class="ri-menu-line"></i>
      </button>

      <!-- ===== Main content area ===== -->
      <main id="mainContent" class="main-content">
        <!-- Welcome / empty state (no active conversation) -->
        <section id="welcomeView" class="welcome-view">
          <div class="welcome-inner">
            <div class="welcome-icon"><i class="ri-sparkling-2-fill"></i></div>
            <h1>GPT Image Studio</h1>
            <p>描述你想创作的图片，AI 将为你生成。每次对话都会保存，你可以基于生成结果继续修改。</p>
            <div class="welcome-examples">
              <button class="example-chip" type="button" data-example="一只戴着宇航员头盔的猫在月球上行走，写实摄影风格">宇航员猫</button>
              <button class="example-chip" type="button" data-example="赛博朋克风格的东京街头夜景，霓虹灯倒映在雨中的地面">赛博朋克东京</button>
              <button class="example-chip" type="button" data-example="极简主义风格的品牌 Logo 设计，抽象几何图形，渐变色">Logo 设计</button>
              <button class="example-chip" type="button" data-example="一碗冒着热气的日式拉面，俯拍角度，美食摄影">美食摄影</button>
            </div>
          </div>
          <div id="welcomeComposer" class="composer-area">
            <form id="welcomeForm" class="composer-form">
              <div class="composer-input-row">
                <textarea id="welcomeInput" class="composer-textarea" rows="1" placeholder="描述你想创作的图片..."></textarea>
                <button class="composer-send" type="submit" title="生成"><i class="ri-arrow-up-line"></i></button>
              </div>
            </form>
          </div>
        </section>

        <!-- Active conversation view -->
        <section id="chatView" class="chat-view hidden">
          <div class="chat-header">
            <button id="chatSidebarToggle" class="icon-btn mobile-only" type="button"><i class="ri-menu-line"></i></button>
            <h2 id="chatTitle" class="chat-title">新对话</h2>
            <button id="chatTitleEdit" class="icon-btn" type="button" title="重命名"><i class="ri-pencil-line"></i></button>
          </div>
          <div id="messageList" class="message-list"></div>
          <div id="generationStatus" class="generation-status hidden">
            <div class="typing-indicator"><span></span><span></span><span></span></div>
            <span id="funMessage">生成中...</span>
          </div>
          <div class="composer-area">
            <form id="chatForm" class="composer-form">
              <div class="composer-options">
                <select id="sizeSelect" class="option-select">
                  <option value="auto">自动尺寸</option>
                  <option value="1024x1024">1024×1024</option>
                  <option value="1536x1024">1536×1024</option>
                  <option value="1024x1536">1024×1536</option>
                  <option value="2048x2048">2048×2048</option>
                </select>
                <select id="qualitySelect" class="option-select">
                  <option value="auto">自动质量</option>
                  <option value="low">低</option>
                  <option value="medium">中</option>
                  <option value="high">高</option>
                </select>
              </div>
              <div class="composer-input-row">
                <textarea id="chatInput" class="composer-textarea" rows="1" placeholder="描述修改需求，或输入新的图片需求..."></textarea>
                <button class="composer-send" type="submit" title="生成"><i class="ri-arrow-up-line"></i></button>
              </div>
            </form>
          </div>
        </section>
      </main>

      <!-- ===== Overlay for mobile sidebar ===== -->
      <div id="sidebarOverlay" class="sidebar-overlay hidden"></div>

      <!-- ===== Modal & Toast layers ===== -->
      <div id="modalLayer" class="modal-layer hidden"></div>
      <div id="toastLayer" class="toast-layer"></div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
